version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - nilerr
    - wrapcheck
    - gosec
  settings:
    gosec:
      # gosec rules G7XX and G304 deal with injection via user input, but the
      # CNI is meant to run only with trusted input provided by the CRI. These
      # rules ended up producing a lot of noise.
      excludes:
        - G703
        - G704
        - G706
        - G304

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ironcore-dev/feCNI
