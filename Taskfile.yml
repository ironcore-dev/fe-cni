# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  # FeCNI is a Linux CNI plugin — always target Linux.
  GOOS: linux
  GOARCH:
    sh: go env GOARCH
  BUILD_DIR: build
  VERSION:
    sh: cat VERSION 2>/dev/null || echo dev

env:
  CGO_ENABLED: '0'
  GOOS: '{{.GOOS}}'

tasks:
  default:
    silent: true
    cmds: [task --list]

  build:
    desc: Build the FeCNI binaries (pass GOARCH variable for cross-architecture build)
    env:
      GOARCH: '{{.GOARCH}}'
    method: timestamp
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BUILD_DIR}}/fecni-{{.GOOS}}-{{.GOARCH}}'
      - '{{.BUILD_DIR}}/fecni-init-{{.GOOS}}-{{.GOARCH}}'
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/fecni-{{.GOOS}}-{{.GOARCH}} ./cmd/fecni
      - go build -o {{.BUILD_DIR}}/fecni-init-{{.GOOS}}-{{.GOARCH}} ./cmd/fecni-init

  image:
    desc: Build FeCNI container image (pass GOARCH variable for cross-architecture image build)
    method: timestamp
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
      - Dockerfile
      - VERSION
    generates:
      - '{{.BUILD_DIR}}/fecni_{{.GOOS}}_{{.GOARCH}}_{{.VERSION}}.tar'
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - docker buildx build --platform {{.GOOS}}/{{.GOARCH}} -t fecni:{{.VERSION}} --load .
      - docker save fecni:{{.VERSION}} -o {{.BUILD_DIR}}/fecni_{{.GOOS}}_{{.GOARCH}}_{{.VERSION}}.tar

  test:unit:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:e2e:
    desc: Run e2e tests
    summary: |
      Run e2e tests

      By default, this task will run every test suite found in the 'tests/'
      directory. If you wish to run only a specific subset of tests, you can
      pass paths to tests suites (and any other BATS options) as CLI arguments

      Example:
        $ task test:e2e -- tests/smoke.bats

    deps:
      - image
    cmds:
      - task: e2e:run

  lint:
    desc: Run code linters
    silent: true
    cmds:
      - echo "linting Go code"
      - golangci-lint run
      - echo "linting e2e tests"
      - task: e2e:lint

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

includes:
  e2e:
    internal: true
    taskfile: ./tests/Taskfile.yml
