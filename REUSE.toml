version = 1
SPDX-PackageName = "fe-cni"
SPDX-PackageSupplier = "IronCore authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/ironcore-dev/fe-cni"

[[annotations]]
path = [
    ".gitignore",
    ".golangci.yaml",
    "Dockerfile",
    "go.mod",
    "go.sum",
    "REUSE.toml",
    "Taskfile.yml",
    "VERSION",
    ".taskfiles/**",
    "manifests/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "README.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "CC-BY-4.0"
