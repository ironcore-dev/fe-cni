# The purpose of this simple DaemonSet is to test
# connectivity. When deployed on a multi-node cluster,
# each pod should be able to ping every other pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: probe
spec:
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: probe
        image: busybox:1.36
        command: ["sleep", "infinity"]
