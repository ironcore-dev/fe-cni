name: Tests

on:
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  schedule:
    # Run regularly at 3:22 each Monday
    - cron: "22 3 * * 1"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: golangci/golangci-lint-action@v9

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq shellcheck

      - name: Run tests
        run: task lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Run tests
        run: task test:unit

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -yqq kind

      - name: Run tests
        run: task test:e2e

