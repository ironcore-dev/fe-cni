---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fecni
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fecni
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fecni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fecni
subjects:
  - kind: ServiceAccount
    name: fecni
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fecni
  namespace: kube-system
  labels:
    app: fecni
spec:
  selector:
    matchLabels:
      app: fecni
  template:
    metadata:
      labels:
        app: fecni
    spec:
      serviceAccountName: fecni
      hostNetwork: true
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      initContainers:
        - name: install-cni
          image: fecni:v0.1.0-dev
          command: ["cp", "/fecni", "/host/opt/cni/bin/fecni"]
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
        - name: configure-cni
          image: fecni:v0.1.0-dev
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              API_HOST="${KUBERNETES_SERVICE_HOST}"
              case "${API_HOST}" in
                *:*) API_HOST="[${API_HOST}]" ;;
              esac
              API_URL="https://${API_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/nodes/${NODE_NAME}"

              echo "Fetching podCIDR for node ${NODE_NAME} from ${API_URL}"
              PODCIDR=$(wget -q -O - \
                --no-check-certificate \
                --header="Authorization: Bearer ${TOKEN}" \
                "${API_URL}" \
                | sed -n 's/.*"podCIDR": *"\([^"]*\)".*/\1/p')

              if [ -z "${PODCIDR}" ]; then
                echo "ERROR: node ${NODE_NAME} has no spec.podCIDR set."
                echo "Set it with:"
                echo "  kubectl patch node ${NODE_NAME} --type=merge -p '{\"spec\":{\"podCIDR\":\"<your-ipv6-subnet>\"}}'"
                exit 1
              fi

              echo "Node ${NODE_NAME} podCIDR: ${PODCIDR}"

              sed "s|__PODCIDR_SUBNET__|${PODCIDR}|g" \
                /template/fecni.conflist \
                > /host/etc/cni/net.d/fecni.conflist

              echo "CNI config written to /host/etc/cni/net.d/fecni.conflist:"
              cat /host/etc/cni/net.d/fecni.conflist
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
            - name: cni-conflist-template
              mountPath: /template
      containers:
        - name: fecni
          image: fecni:v0.1.0-dev
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            privileged: true
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: cni-conflist-template
          configMap:
            name: fecni-conflist-template
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fecni-conflist-template
  namespace: kube-system
data:
  fecni.conflist: |
    {
      "cniVersion": "1.1.0",
      "name": "fecni",
      "plugins": [
        {
          "type": "fecni",
          "subnet": "__PODCIDR_SUBNET__"
        }
      ]
    }
